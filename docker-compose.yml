services:
  db:
    image: mariadb:10.11
    container_name: accessory_as_db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_persian_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass_accessory_as_2026}
      MARIADB_DATABASE: accessory_as
      MARIADB_USER: accessory
      MARIADB_PASSWORD: ${DB_PASSWORD:-pass_accessory_as_2026}
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - accessory_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: accessory_as_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - DATABASE_URL=mysql://accessory:${DB_PASSWORD:-pass_accessory_as_2026}@db:3306/accessory_as
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-accessory_as_secret_long_key_2026_prod}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3002}
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - accessory_net

volumes:
  db_data:

networks:
  accessory_net:
    driver: bridge
